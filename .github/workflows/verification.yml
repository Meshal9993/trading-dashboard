name: Offline verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      YAHOO_FEED_ENABLED: 'false'
      YAHOO_STREAM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare test database path and log directory
        run: |
          echo "DATABASE_PATH=$RUNNER_TEMP/verification.sqlite3" >> "$GITHUB_ENV"
          mkdir -p artifacts/logs

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v7
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        id: backend_dependencies
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python -m pip install -r backend/requirements-dev.txt 2>&1 | tee artifacts/logs/backend-dependencies.log

      - name: Install frontend dependencies
        id: frontend_dependencies
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        working-directory: frontend
        run: npm ci 2>&1 | tee ../artifacts/logs/frontend-dependencies.log

      - name: Backend tests
        if: ${{ !cancelled() && steps.backend_dependencies.outcome == 'success' }}
        run: python -m pytest backend/tests -q 2>&1 | tee artifacts/logs/backend-tests.log

      - name: Frontend tests
        if: ${{ !cancelled() && steps.frontend_dependencies.outcome == 'success' }}
        working-directory: frontend
        run: npm test 2>&1 | tee ../artifacts/logs/frontend-tests.log

      - name: Production build
        if: ${{ !cancelled() && steps.frontend_dependencies.outcome == 'success' }}
        working-directory: frontend
        run: npm run build 2>&1 | tee ../artifacts/logs/production-build.log

      - name: Browser smoke test
        if: ${{ !cancelled() && steps.backend_dependencies.outcome == 'success' && steps.frontend_dependencies.outcome == 'success' }}
        run: python scripts/smoke.py --output-dir artifacts/smoke 2>&1 | tee artifacts/logs/browser-smoke.log

      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
